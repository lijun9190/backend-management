server:
  port: 9200

spring:
  application:
    name: backend-auth
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:13306/backend-management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root} # 中文注释：生产环境请通过环境变量覆盖数据库用户名
    password: ${MYSQL_PASSWORD:} # 中文注释：生产环境请通过环境变量提供数据库密码
  redis:
    host: ${REDIS_HOST:127.0.0.1} # 中文注释：生产环境请通过环境变量覆盖Redis地址
    port: ${REDIS_PORT:6379}  # 中文注释：生产环境请通过环境变量覆盖Redis端口
    password: ${REDIS_PASSWORD:} # 中文注释：生产环境请通过环境变量提供Redis密码
    database: ${REDIS_DATABASE:0}
    timeout: 3000ms

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

security:
  cookie:
    secure: ${COOKIE_SECURE:false}
  login-attempt:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    failure-window-minutes: ${LOGIN_FAILURE_WINDOW_MINUTES:15}
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:keys/private_key.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/public_key.pem}
    access-expire-seconds: 1800
    refresh-expire-seconds: 604800
    refresh-max-expire-seconds: 2592000

logging:
  level:
    com.example: info
