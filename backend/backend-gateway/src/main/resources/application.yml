server:
  port: 8080

spring:
  application:
    name: backend-gateway
  redis:
    host: 192.168.150.199 # 中文注释：这里改成你的 Redis 地址
    port: 6379 # 中文注释：这里改成你的 Redis 端口
    password: imooc # 中文注释：如果你的 Redis 设置了密码，请在这里填写
    database: 0
    timeout: 3000ms
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      routes:
        - id: auth-service
          uri: http://127.0.0.1:9200
          predicates:
            - Path=/api/auth/**
        - id: system-service
          uri: http://127.0.0.1:9300
          predicates:
            - Path=/api/system/**

security:
  jwt:
    public-key-path: keys/public_key.pem
    access-expire-seconds: 1800
  ignore:
    urls:
      - /api/auth/login
      - /api/auth/refresh
      - /actuator/**
      - /error

logging:
  level:
    com.example: info
