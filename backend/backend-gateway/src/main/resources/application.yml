server:
  port: 8080

spring:
  application:
    name: backend-gateway
  redis:
    host: ${REDIS_HOST:127.0.0.1} # 中文注释：生产环境请通过环境变量覆盖Redis地址
    port: ${REDIS_PORT:6379} # 中文注释：生产环境请通过环境变量覆盖Redis端口
    password: ${REDIS_PASSWORD:} # 中文注释：生产环境请通过环境变量提供Redis密码
    database: ${REDIS_DATABASE:0}
    timeout: 3000ms
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      routes:
        - id: auth-service
          uri: http://127.0.0.1:9200
          predicates:
            - Path=/api/auth/**
        - id: system-service
          uri: http://127.0.0.1:9300
          predicates:
            - Path=/api/system/**

security:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/public_key.pem}
    access-expire-seconds: 1800
  ignore:
    urls:
      - /api/auth/login
      - /api/auth/refresh
      - /actuator/**
      - /error

logging:
  level:
    com.example: info
