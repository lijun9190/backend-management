server:
  port: 9300

spring:
  application:
    name: backend-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:13306/backend-management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root # 中文注释：这里改成你的 MySQL 用户名
    password: 123456 # 中文注释：这里改成你的 MySQL 密码
  redis:
    host: 192.168.150.199 # 中文注释：这里改成你的 Redis 地址
    port: 6379 # 中文注释：这里改成你的 Redis 端口
    password: imooc # 中文注释：如果你的 Redis 设置了密码，请在这里填写
    database: 0
    timeout: 3000ms

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

security:
  jwt:
    secret: backend-manager-secret-key
    access-expire-seconds: 1800

logging:
  level:
    com.example: info
